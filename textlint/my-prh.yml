# prh version
version: 1
rules:

  # MOLCURE / 創薬・生物系
  - expected: MOLCURE

  - expected: VHH

  - expected: scFv

  - expected: Fab

  - expected: F(ab')2
    patterns:
      - Fab2
      - F(ab)2
      - fab2
      - FAB2
      - F(AB)2
      - F(Ab)2
      - F(ab2)
      - F(AB2)
      - F(Ab2)
    specs:
      - from: Fab2
        to: F(ab')2
      - from: F(ab)2
        to: F(ab')2

  - expected: IgG

  - expected: IgM

  - expected: IgE

  - expected: IgA

  - expected: IgD

  - expected: Biacore

  # textlint
  - expected: textlint

  # 英字・技術用語
  - expected: GitHub

  - expected: macOS
