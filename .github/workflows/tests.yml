name: Tests

# HIR-225 inventory (22 existing test entry points)
# ubuntu-latest (portable: no macOS runtime/API dependency in the exercised boundary):
# - defaults/tests/test_powerpoint_shortcut_refactor.py — fixture-only Python test; requires pytest
# - textlint/tests/test_textlint_runtime_plan.py — temporary HOME + fake node/pnpm
# - textlint/tests/test_textlint_symlink_contract.py — repository/static contract test
# - textlint/tests/test_notion_textlint.py — temporary HOME + fake ntn/textlint subprocess boundary
# - textlint/tests/test_notion_textlint_setup_contract.py — temporary HOME + fake node/pnpm PRH link contract
# - apps/amphetamine/tests/test_amphetamine_setup.sh — temp-dir fixture; defaults/plutil are test doubles; requires rg
# - apps/codex/custom-instructions/tests/test-mirror-bookmark-contract.sh — Python source-contract inspection only
# - apps/codex/custom-instructions/tests/test-openai-instructions-contract.sh — temp dirs + fake helper/ntn; standard shell/Ruby/JQ boundary
# - apps/codex/custom-instructions/tests/test-sync-custom-instructions.sh — isolated temp harness + fake helper/ntn; standard shell/Ruby/JQ boundary
# - apps/codex/custom-instructions/tests/test_custom_instructions_setup_contract.sh — xcrun/codesign/ditto/plutil/launchctl/defaults/PlistBuddy are test doubles
# - apps/codex/tests/test_codex_setup_delegation_contract.sh — temporary repository-shaped fixture + Bash/Python/stub delegates
# - apps/codex/tests/test_setup_macos_codex_entrypoint.sh — static Python source-contract inspection only
# - apps/ferdium/tests/test_ferdium_setup.sh — temporary HOME + filesystem/symlink fixture only
# - lib/tests/test_hir119_karabiner_setup.sh — temporary fixture; goku/launchctl/common helpers are test doubles
# - lib/tests/test_karabiner_migration.sh — temp filesystem + static contracts; optional goku runtime check self-skips when unavailable
# - lib/tests/test_setup_call_contracts.sh — Bash/AWK/Python/rg static contract checks
# macos-latest (macOS-specific runtime/semantics required):
# - apps/codex/custom-instructions/tests/test-mirror-layout.sh — compiles Swift with `-framework AppKit`
# - lib/tests/test_symlink_helpers.sh — validates BSD/macOS `stat -f '%i'` inode semantics
# excluded (clean single-repository checkout cannot satisfy sibling-repository source dependencies):
# - apps/codex/agents/tests/test_agents_setup.sh — requires ../harness/agents for its default-path scenario
# - apps/codex/hooks/tests/test_install_hooks.sh — requires ../harness/hooks to seed its isolated fixture
# - apps/codex/skills/tests/test_skills_setup.sh — requires ../harness/skills for its default-path scenario
# - hammerspoon/tests/test_hammerspoon_setup.sh — requires ../scripts/hammerspoon and ../scripts/raycast

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Python test dependency
        run: python3 -m pip install pytest
      - name: Run portable Python tests
        run: |
          set -euo pipefail
          python3 -m pytest -q defaults/tests/test_powerpoint_shortcut_refactor.py
          python3 textlint/tests/test_textlint_runtime_plan.py
          python3 textlint/tests/test_textlint_symlink_contract.py
          python3 textlint/tests/test_notion_textlint.py
          python3 textlint/tests/test_notion_textlint_setup_contract.py
      - name: Install portable shell dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Run portable shell tests
        run: |
          set -euo pipefail
          bash apps/amphetamine/tests/test_amphetamine_setup.sh
          bash apps/codex/custom-instructions/tests/test-mirror-bookmark-contract.sh
          bash apps/codex/custom-instructions/tests/test-openai-instructions-contract.sh
          bash apps/codex/custom-instructions/tests/test-sync-custom-instructions.sh
          bash apps/codex/custom-instructions/tests/test_custom_instructions_setup_contract.sh
          bash apps/codex/tests/test_codex_setup_delegation_contract.sh
          bash apps/codex/tests/test_setup_macos_codex_entrypoint.sh
          bash apps/ferdium/tests/test_ferdium_setup.sh
          bash lib/tests/test_hir119_karabiner_setup.sh
          bash lib/tests/test_karabiner_migration.sh
          bash lib/tests/test_setup_call_contracts.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run macOS-specific tests
        run: |
          set -euo pipefail
          bash apps/codex/custom-instructions/tests/test-mirror-layout.sh
          bash lib/tests/test_symlink_helpers.sh
