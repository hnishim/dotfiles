schema_version = 1
snapzy_min_version = "1.31.0"

[general]
language = "en"
appearance = "system"
play_sounds = false
url_scheme_enabled = true
show_menu_bar_icon = false
start_at_login = true
export_location = "~/Documents/screenshots"

[updates]
check_automatically = true
download_automatically = true
channel = "stable"

[diagnostics]
enabled = true
retention_days = 3

[menu_bar]
icon_style = "cameraViewfinder"
item_order = ["captureArea", "captureAreaAnnotate", "captureApplication", "captureFullscreen", "captureActiveWindow", "scrollingCapture", "captureOCR", "captureSmartElement", "captureObjectCutout", "recordScreen", "recordApplication", "openAnnotate", "combineImages", "editVideo", "cloudUploads", "openHistory", "shortcutList"]
hidden_items = []

[capture]
hide_desktop_icons = false
hide_desktop_widgets = false

[capture.naming]
screenshot_template = "screenshot_{datetime}_{ms}"
recording_template = "recording_{datetime}"

[capture.screenshot]
format = "png"
include_snapzy = true
show_cursor = true
freeze_area = false
show_selection_area_overlay = false
reverse_magnifier_zoom_direction = false
show_magnifier_by_default = true
show_magnifier_color_panel = true

[capture.scrolling]
show_hints = true

[capture.ocr]
success_notification = true
selected_model = "builtin"
custom_models = "[]"

[capture.object_cutout]
auto_crop = true

[capture.after.screenshot]
save = false
quick_access = true
copy_file = true
open_annotate = false

[capture.after.recording]
save = true
quick_access = true
copy_file = true
open_annotate = false

[recording]
format = "mov"
quality = "high"
fps = 30
output_mode = "video"
capture_system_audio = true
capture_microphone = false
microphone_device_id = "system-default"
remember_last_area = true
include_snapzy = false
show_cursor = true
dim_non_selected_area = true
highlight_clicks = false
show_keystrokes = false
video_editor_zoom_transition_duration = 0.4

[recording.mouse_highlight]
size = 50.0
animation_duration = 0.7
color = "#003AFF"
opacity = 0.5
ripple_count = 3

[recording.keystrokes]
font_size = 16.0
position = "bottomCenter"
display_duration = 1.5

[recording.annotation_shortcuts]
modifier = "shift"
hold_duration = 0.3

[quick_access]
enabled = true
position = "bottomRight"
auto_dismiss = true
auto_dismiss_delay = 5.0
pause_countdown_on_hover = true
overlay_scale = 1.0
drag_drop = true
two_finger_swipe_to_dismiss = true
swipe_sensitivity = 1.0
trackpad_swipe_mode = "inverted"
swipe_left_action = "dismiss"
swipe_right_action = "dismiss"
hide_card_when_window_open = true
animation_style = "slide"
actions_order = ["copy", "saveOrOpen", "dismiss", "delete", "edit", "uploadToCloud", "pinToScreen"]
enabled_actions = ["copy", "delete", "dismiss", "edit", "saveOrOpen"]

[quick_access.slots]
center_top = "copy"
center_bottom = "saveOrOpen"
top_trailing = "dismiss"
top_leading = "delete"
bottom_leading = "edit"
bottom_trailing = "uploadToCloud"

[history]
enabled = true
retention_days = 30
max_count = 500
background_style = "hud"
open_on_launch = false

[history.floating]
enabled = true
position = "topCenter"
default_filter = "all"
max_displayed_items = 10
scale = 1.0
auto_clear_days = 0

[cloud]
provider = "aws_s3"
bucket = ""
region = "us-east-1"
endpoint = ""
custom_domain = ""
expire_time = "7d"
uploads_window_position = "center"

[annotate]
clipboard_image_open_behavior = "loadAutomatically"
default_tool = "selection"
remember_last_tool = true
close_after_drag = true
bring_forward_after_drag = false
quick_properties_sync = true
combine_save_as_edit = true
crop_snap_to_edges = true
highlighter_text_snapping = true

[shortcuts]
enabled = true

[shortcuts.global.fullscreen]
enabled = true
key = "V"
modifiers = ["command", "control"]

[shortcuts.global.area]
enabled = true
key = "J"
modifiers = ["command", "control"]

[shortcuts.global.repeat_area]
enabled = false
key = "4"
modifiers = ["command", "shift", "control"]

[shortcuts.global.area_annotate]
enabled = false
key = "7"
modifiers = ["command", "shift"]

[shortcuts.global.active_window]
enabled = true
key = "E"
modifiers = ["command", "control"]

[shortcuts.global.scrolling_capture]
